name: Release

on:
  push:
    tags: ['v*']

# 创建 Release 需要写 contents，其余保持只读
permissions:
  contents: write

jobs:
  release:
    name: Package & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # tag 不是版本来源，只是断言：与 package.json 不一致就中止
      - name: Verify tag matches package.json version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi
          echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tag 可能打在未经 CI 的提交上，这里不能假设已验证
      - run: make check

      - run: make package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: tab-station-${{ steps.version.outputs.version }}.zip
        run: |
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          # 带连字符的 tag（如 v0.2.0-beta.1）视为预发布
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$ZIP" "${args[@]}"
